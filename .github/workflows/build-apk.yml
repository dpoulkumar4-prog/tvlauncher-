
name: Build Aurora TV Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -q MyTVLauncher-GitHub-Build.zip -d extracted

      - name: Find Gradle project
        run: |
          find extracted -name gradlew -type f

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name gradlew -type f | head -n 1)")
          chmod +x "$PROJECT_DIR/gradlew"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-TV-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
